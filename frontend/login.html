<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - IntervAi</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth">
    <div class="authbox">
      <h1>Welcome Back 👋</h1>
      <p class="muted">Login to IntervAi.</p>

      <input id="loginEmail" class="input" type="email" placeholder="Email">
      <input id="loginPass" class="input" type="password" placeholder="Password">

      <button class="primary" onclick="login()">Login</button>

      <p class="center">New user?
        <a href="register.html">Create account</a>
      </p>
    </div>
  </div>
  <script src="../js/auth.js"></script>
</body>
</html>
