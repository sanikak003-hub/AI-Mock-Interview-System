<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - IntervAi</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth">
    <div class="authbox">
      <h1>Create Account 🚀</h1>
      <p class="muted">Join IntervAi and practice interviews.</p>

      <input id="regName" class="input" placeholder="Full Name">
      <input id="regEmail" class="input" type="email" placeholder="Email">
      <input id="regPass" class="input" type="password" placeholder="Password">

      <button class="primary" onclick="registerUser()">Create Account</button>

      <p class="center">Already registered?
        <a href="login.html">Login</a>
      </p>
    </div>
  </div>
  <script src="../js/auth.js"></script>
</body>
</html>
